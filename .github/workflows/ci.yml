name: CI Tests

on:
  # Runs tests whenever someone opens or updates a Pull Request, whatever branch it targets.
  #
  # This used to be limited to 'main' and 'dev', so a long-running feature branch that takes
  # its pieces as PRs of its own (feature/system-builder, with sb/* pieces merged into it)
  # was never tested until the final merge to main. Every PR is a change about to land
  # somewhere, so every PR gets the suites.
  pull_request:

  # Runs tests when code is merged or pushed directly to 'main'.
  #
  # Not 'dev': a push there triggers Dev Build to Docker Hub, which runs both suites
  # itself before publishing. Adding it here would run the same tests twice on every
  # dev commit for no extra signal.
  push:
    branches:
      - main

jobs:
  validate-docker-config:
    name: Docker Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dockerfile sets ENV DB_PATH
        run: grep -q "ENV DB_PATH=/app/data/city.db" Dockerfile.backend

      - name: Dockerfile creates /app/data at build time
        run: grep -q "mkdir -p" Dockerfile.backend

      - name: .dockerignore excludes backend/data/
        run: grep -qx "backend/data/" .dockerignore

      - name: .dockerignore excludes backend/uploads/
        run: grep -q "backend/uploads" .dockerignore

  validate-nginx-behaviour:
    name: Nginx Proxy Behaviour
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Every other test in this repository mounts an Express router directly, so nothing
      # exercises the proxy that all of it actually arrives through. Two faults in one
      # release lived exactly there — a body limit smaller than the app's own, and a
      # missing X-Forwarded-For — both invisible to a thousand passing unit tests. This
      # runs the real nginx against the repository's real config.
      #
      # These steps were run by hand against nginx:alpine before being written down, and
      # the counterfactual checked too: the same 40MB body against the previous 25M
      # ceiling returns 413, so the probe fails when the config is wrong rather than
      # passing regardless.
      - name: Start a stub backend that reports what it received
        run: |
          cat > /tmp/stub.js <<'STUB'
          const http = require('http');
          http.createServer((req, res) => {
            let bytes = 0;
            req.on('data', (c) => { bytes += c.length; });
            req.on('end', () => {
              res.setHeader('content-type', 'application/json');
              res.end(JSON.stringify({
                path: req.url,
                bytes,
                xff: req.headers['x-forwarded-for'] || null,
                upgrade: req.headers['upgrade'] || null,
                connection: req.headers['connection'] || null,
              }));
            });
          }).listen(5000, '0.0.0.0');
          STUB
          node /tmp/stub.js &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:5000/ >/dev/null && break; sleep 0.5; done

      - name: Run nginx with the repository config
        run: |
          # host-gateway is the documented way for a bridged container to reach the
          # host, which is where the stub is listening. The config names the upstream
          # "backend", exactly as it does in compose, so the file under test is unmodified.
          # The official nginx image through Google's Docker Hub mirror: Docker Hub refuses
          # downloads without a login once GitHub's shared runners use up its per-address
          # limit (three failed runs in a row, 2026-10-09). Same image, no such limit.
          docker run -d --name proxy -p 8080:80             --add-host backend:host-gateway             -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro"             mirror.gcr.io/library/nginx:alpine
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8080/api/ping && break; sleep 0.5; done
          docker logs proxy

      - name: A large battle map passes through the proxy
        run: |
          # 40MB — an ordinary animated map, and well past the old 25M ceiling.
          head -c 40000000 /dev/zero > /tmp/big.webm
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST             --data-binary @/tmp/big.webm http://127.0.0.1:8080/api/upload-probe)
          echo "status $code"; cat /tmp/out.json
          test "$code" = "200" || { echo "proxy refused a large body"; exit 1; }
          grep -q '"bytes":40000000' /tmp/out.json || { echo "body did not arrive whole"; exit 1; }

      - name: The caller's address reaches the backend
        run: |
          curl -s http://127.0.0.1:8080/api/who > /tmp/who.json
          cat /tmp/who.json
          grep -q '"xff":"' /tmp/who.json || { echo "X-Forwarded-For was not forwarded"; exit 1; }

      - name: The socket path offers an upgrade
        run: |
          curl -s -o /tmp/ws.json             -H 'Upgrade: websocket' -H 'Connection: Upgrade'             http://127.0.0.1:8080/socket.io/probe
          cat /tmp/ws.json
          grep -q '"upgrade":"websocket"' /tmp/ws.json || { echo "Upgrade header was dropped"; exit 1; }

      - name: Stop nginx
        if: always()
        run: docker rm -f proxy || true

  updater-journey:
    name: Updater on Real Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The in-app updater's own tests replace Docker with stand-ins, and the stand-ins shared
      # the code's wrong assumptions: Windows servers failed every helper, and the second
      # in-app update after any first one failed, neither seen until a real install hit it.
      # This builds the real server image from the checkout, starts a throwaway install from
      # the real docker-compose.yml with a local registry, and drives the real updater through
      # the server's API: two updates in a row, dev builds on and off, the data kept.
      #
      # Run by hand on Docker Desktop for Windows before being written down, and the
      # counterfactual checked: with the previous updater it fails at the second update with
      # the error a real install reported ("read /tmp/docker-compose.yml: is a directory").
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Two in-app updates, then dev builds on and off
        run: node docker-test/updater-journey.mjs

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build (type-check + bundle)
        run: npm run build

  # The browser journeys (e2e/, 4l): the real backend and frontend started on a throwaway database,
  # driven in Playwright's own headless Chromium. On a developer's machine they run only when asked
  # (e2e/README.md); here, on every pull request.
  test-e2e:
    name: Browser Journeys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ./backend/package-lock.json
            ./frontend/package-lock.json
            ./e2e/package-lock.json

      - name: Install the backend
        working-directory: ./backend
        run: npm ci

      - name: Install the frontend
        working-directory: ./frontend
        run: npm ci

      - name: Install the journeys
        working-directory: ./e2e
        run: npm ci

      - name: Install Chromium
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Run the journeys
        working-directory: ./e2e
        run: npx playwright test

      # What failed and why: screenshots, a trace of every step, and the HTML report.
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
