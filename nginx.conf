server {
    listen 80;

    # The outer bound on an upload, and it has to be at least the largest limit the app
    # itself allows or the proxy refuses the request before the app ever sees it — with a
    # 413 that comes from nginx, not from us, so it names neither the file nor the reason.
    #
    # This is not the real limit. Each route enforces its own (see LIMITS in
    # backend/middleware/uploadConstraints.js): 250MB for battle maps, since an animated
    # map is a video, and far less for everything else. This only has to be no smaller
    # than the biggest of them. A backend test asserts that it is.
    client_max_body_size 250M;

    # Serve the built React app
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html so browsers always fetch the latest hashed asset URLs
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy REST API to backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Express reads this one, not X-Real-IP. Without it every request reaches the
        # backend from this container's address, and anything counting per caller counts
        # the whole house as one.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Socket.IO with WebSocket upgrade
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Proxy uploaded files
    location /uploads/ {
        proxy_pass http://backend:5000;
    }
}
